[package]
name = "kmpl"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["bundled-tls"]
dynamic-llvm = ["kmpl_codegen/dynamic-llvm"]
# TLS for downloading modules: built in, or the system's OpenSSL for
# distributions (build with `--no-default-features --features dynamic-tls`).
bundled-tls = ["minreq/https-rustls"]
dynamic-tls = ["minreq/https-native-tls"]

[dependencies]
kmpl_ast.workspace = true
kmpl_lexer.workspace = true
kmpl_parse.workspace = true
kmpl_check.workspace = true
kmpl_lower.workspace = true
kmpl_ir.workspace = true
kmpl_codegen.workspace = true
minreq.workspace = true
sha2.workspace = true
