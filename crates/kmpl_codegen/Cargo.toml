[package]
name = "kmpl_codegen"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Link against the shared libLLVM instead of embedding LLVM in the binary.
# For distributions that already ship LLVM.
dynamic-llvm = ["inkwell/llvm23-1-force-dynamic"]

[dependencies]
kmpl_ast.workspace = true
kmpl_builtins.workspace = true
kmpl_ir.workspace = true
inkwell.workspace = true

[dev-dependencies]
kmpl_lexer.workspace = true
kmpl_parse.workspace = true
kmpl_check.workspace = true
kmpl_lower.workspace = true
