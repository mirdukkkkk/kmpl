[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
kmpl_ast      = { path = "crates/kmpl_ast" }
kmpl_builtins = { path = "crates/kmpl_builtins" }
kmpl_lexer    = { path = "crates/kmpl_lexer" }
kmpl_parse    = { path = "crates/kmpl_parse" }
kmpl_check    = { path = "crates/kmpl_check" }
kmpl_ir       = { path = "crates/kmpl_ir" }
kmpl_lower    = { path = "crates/kmpl_lower" }
kmpl_codegen  = { path = "crates/kmpl_codegen" }

logos = "0.16.1"
minreq = { version = "3", default-features = false }
sha2 = "0.11"
inkwell = { version = "0.11.0", default-features = false, features = ["llvm23-1", "target-x86", "target-aarch64"] }

[workspace.lints.rust]
unsafe_code = "deny"

# The runtime's speed depends on inlining across crates.
[profile.release]
lto = "fat"
codegen-units = 1
